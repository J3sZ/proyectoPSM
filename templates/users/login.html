<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Estudiantes - UniSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: none;
            border-radius: 10px;
        }
        .brand-logo {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="brand-logo">🎓 UniSystem</div>
        <h5 class="text-center mb-4 text-muted">Portal de Estudiantes</h5>

        {% if form.errors %}
            <div class="alert alert-danger py-2">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuario / Carnet</label>
                <input type="text" name="username" class="form-control" required id="id_username" placeholder="Ingresa tu usuario">
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required id="id_password" placeholder="********">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
        </form>
        
        <div class="text-center mt-3">
            <small class="text-muted">¿Problemas para entrar? Contacta a control de estudios.</small>
        </div>
    </div>

</body>
</html>
